<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Работает</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat {
            width: 100%;
            max-width: 700px;
            height: 85vh;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #00ff88;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 20px;
            animation: fadeIn 0.3s ease;
            line-height: 1.4;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .ai {
            background: rgba(255,255,255,0.9);
            color: #1a1a2e;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            white-space: pre-wrap;
        }
        .typing {
            background: rgba(255,255,255,0.9);
            color: #666;
            align-self: flex-start;
            padding: 12px 18px;
            border-radius: 20px;
        }
        .input-area {
            padding: 20px;
            background: rgba(0,0,0,0.3);
            display: flex;
            gap: 12px;
        }
        input {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255,255,255,0.9);
            font-size: 1em;
            outline: none;
        }
        button {
            padding: 14px 32px;
            background: #00ff88;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            color: #1a1a2e;
        }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; transform: none; }
        .status {
            text-align: center;
            padding: 5px;
            font-size: 11px;
            color: #888;
            background: rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="chat">
        <div class="header">🤖 Groq AI Assistant (Llama 3)</div>
        <div class="messages" id="messages">
            <div class="message ai">Привет! Я работаю на Groq AI (Llama 3). Напиши сообщение!</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Напиши сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Отправить</button>
        </div>
        <div class="status" id="status">✅ Готов к работе</div>
    </div>

    <script>
        // ТВОЙ API КЛЮЧ
        const API_KEY = "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";
        
        // ИСПРАВЛЕНО: Используем актуальную модель
        const MODEL = "llama3-70b-8192";  // или "llama3-8b-8192", "llama-3.3-70b-versatile"
        
        const messagesDiv = document.getElementById('messages');
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');
        
        let isWaiting = false;

        function setStatus(text, isError = false) {
            statusDiv.innerHTML = text;
            statusDiv.style.color = isError ? '#ff8888' : '#888';
            setTimeout(() => {
                if (!isError) statusDiv.innerHTML = '✅ Готов к работе';
                statusDiv.style.color = '#888';
            }, 3000);
        }

        async function sendMessage() {
            if (isWaiting) return;
            
            const text = inputField.value.trim();
            if (!text) return;

            isWaiting = true;
            inputField.value = '';
            sendBtn.disabled = true;
            inputField.disabled = true;
            
            addMessage(text, 'user');
            showTyping();
            setStatus('🔄 Отправка запроса к Groq...');

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL,  // ← Исправлено!
                        messages: [
                            {
                                role: "system",
                                content: "Ты дружелюбный AI ассистент. Отвечай на русском языке кратко, ясно и по делу. Используй смайлики где уместно."
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                setStatus(`📥 Статус: ${response.status}`);

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                
                hideTyping();
                addMessage(reply, 'ai');
                setStatus('✅ Ответ получен!');

            } catch (error) {
                console.error('Error:', error);
                hideTyping();
                
                let errorMsg = '';
                if (error.message.includes('Failed to fetch') || error.message.includes('CORS')) {
                    errorMsg = '⚠️ Проблема с соединением.\n\n📌 РЕШЕНИЕ:\n• Используй браузер Brave\n• Или установи расширение "Allow CORS" в Chrome\n• Или залей этот файл на Netlify';
                } else {
                    errorMsg = `❌ Ошибка: ${error.message}`;
                }
                
                addMessage(errorMsg, 'ai');
                setStatus('⚠️ Ошибка', true);
            } finally {
                isWaiting = false;
                sendBtn.disabled = false;
                inputField.disabled = false;
                inputField.focus();
            }
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        let typingElement = null;
        function showTyping() {
            typingElement = document.createElement('div');
            typingElement.className = 'typing';
            typingElement.innerText = '✍️ AI печатает...';
            messagesDiv.appendChild(typingElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            if (typingElement) typingElement.remove();
            typingElement = null;
        }
    </script>
</body>
</html>

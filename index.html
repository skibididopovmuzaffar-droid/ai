<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MUZAFFAR AI - Умный ассистент с Vision</title>
    <style>
        /* ========== ПЕРЕМЕННЫЕ ДЛЯ ДИЗАЙНА (можно менять под себя) ========== */
        :root {
            --primary-color: #00ff88;
            --primary-dark: #00cc6a;
            --secondary-color: #00bfff;
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #0f3460;
            --sidebar-bg: rgba(0, 0, 0, 0.4);
            --message-user-bg: linear-gradient(135deg, #007bff, #00bfff);
            --message-ai-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-color: rgba(255, 255, 255, 0.15);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }

        .chat-app {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 14px 20px;
            border-radius: 16px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }

        .chat-history-title {
            color: #888;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .chat-item:hover {
            background: var(--hover-color);
        }

        .chat-item.active {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 191, 255, 0.2));
            border-left: 3px solid var(--primary-color);
        }

        .chat-item-title {
            font-weight: 500;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 50px;
        }

        .chat-item-date {
            font-size: 0.7em;
            color: #888;
        }

        .delete-chat-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 68, 68, 0.8);
            border: none;
            padding: 4px 10px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            display: none;
        }

        .chat-item:hover .delete-chat-btn {
            display: block;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-header h2 {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.5em;
        }

        .chat-header p {
            color: #888;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-wrapper {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message-wrapper.ai {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 20px;
            border-radius: 24px;
            line-height: 1.5;
            position: relative;
        }

        .user .message-bubble {
            background: var(--message-user-bg);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .ai .message-bubble {
            background: var(--message-ai-bg);
            color: var(--text-color);
            border-bottom-left-radius: 6px;
            backdrop-filter: blur(5px);
        }

        .message-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-wrapper:hover .message-actions {
            opacity: 1;
        }

        .message-actions button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: white;
            transition: all 0.2s;
        }

        .message-actions button:hover {
            background: rgba(0, 255, 136, 0.5);
        }

        .message-time {
            font-size: 0.7em;
            margin-top: 5px;
            opacity: 0.7;
        }

        .message-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        .typing-indicator {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 24px;
            display: inline-flex;
            gap: 4px;
            backdrop-filter: blur(5px);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .input-area {
            padding: 20px 30px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--border-color);
        }

        .input-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .file-upload-btn, .voice-input-btn, .share-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }

        .file-upload-btn:hover, .voice-input-btn:hover, .share-btn:hover {
            background: var(--hover-color);
            border-color: var(--primary-color);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.15);
        }

        .input-wrapper button {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #1a1a2e;
        }

        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .image-preview {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .image-preview img {
            max-width: 100px;
            border-radius: 8px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
        }

        .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            background: #2a2a3e;
            color: white;
            border: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <div class="sidebar">
            <button class="new-chat-btn" onclick="createNewChat()">✨ Новый чат</button>
            <div class="chat-history-title">История чатов</div>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <h2>🤖 MUZAFFAR AI Vision</h2>
                <p>Анализ изображений через Gemini | Голосовой ввод | Полные ответы</p>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <div class="input-controls">
                    <label class="file-upload-btn">
                        📎 Загрузить изображение
                        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageUpload(this)">
                    </label>
                    <button class="voice-input-btn" onclick="startVoiceInput()">🎤 Голосовой ввод</button>
                    <button class="share-btn" onclick="shareChat()">🔗 Поделиться чатом</button>
                </div>
                <div id="imagePreview" class="image-preview"></div>
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Напишите сообщение или спросите про изображение..." onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button id="sendBtn" onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Редактировать сообщение</h3>
            <textarea id="editText" rows="4"></textarea>
            <button onclick="saveEditedMessage()">Сохранить</button>
            <button onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        // Конфигурация
        const GROQ_API_KEY = "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";
        const GEMINI_API_KEY = "AIzaSyDja7y_ZAH5uSZY52knGKJFwtJyt3-yF8Q";
        const GROQ_MODEL = "llama-3.3-70b-versatile";
        
        // Хранилище
        let chats = [];
        let currentChatId = null;
        let editingMessageIndex = null;
        let currentImageData = null;
        let currentImageName = null;

        // Загрузка
        function loadChats() {
            const saved = localStorage.getItem('muzaffar_chats');
            if (saved) {
                chats = JSON.parse(saved);
            }
            if (chats.length === 0) {
                createNewChat();
            } else {
                currentChatId = chats[0].id;
                renderChatList();
                loadChat(currentChatId);
            }
        }

        function saveChats() {
            localStorage.setItem('muzaffar_chats', JSON.stringify(chats));
        }

        function createNewChat() {
            const newChat = {
                id: Date.now(),
                title: `Чат ${chats.length + 1}`,
                date: new Date().toLocaleString(),
                messages: [
                    { role: 'ai', content: 'Привет! Я MUZAFFAR AI Vision. Могу анализировать изображения через Google Gemini и отвечать на вопросы. Загрузи фото или напиши сообщение! 🚀', timestamp: new Date().toLocaleTimeString() }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            renderChatList();
            loadChat(currentChatId);
        }

        function deleteChat(chatId) {
            if (confirm('Удалить этот чат?')) {
                chats = chats.filter(c => c.id !== chatId);
                if (chats.length === 0) {
                    createNewChat();
                } else {
                    currentChatId = chats[0].id;
                }
                saveChats();
                renderChatList();
                loadChat(currentChatId);
            }
        }

        function loadChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            
            currentChatId = chatId;
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            chat.messages.forEach((msg, idx) => {
                renderMessage(msg.content, msg.role, msg.timestamp, idx, msg.image);
            });
            
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id == chatId) {
                    item.classList.add('active');
                }
            });
        }

        function renderChatList() {
            const listContainer = document.getElementById('chatList');
            listContainer.innerHTML = '';
            
            chats.forEach(chat => {
                const chatDiv = document.createElement('div');
                chatDiv.className = `chat-item ${currentChatId === chat.id ? 'active' : ''}`;
                chatDiv.dataset.id = chat.id;
                chatDiv.onclick = () => loadChat(chat.id);
                
                chatDiv.innerHTML = `
                    <div class="chat-item-title">${escapeHtml(chat.title)}</div>
                    <div class="chat-item-date">${chat.date}</div>
                    <button class="delete-chat-btn" onclick="event.stopPropagation(); deleteChat(${chat.id})">🗑</button>
                `;
                listContainer.appendChild(chatDiv);
            });
        }

        function renderMessage(content, role, timestamp, messageIndex, imageData = null) {
            const container = document.getElementById('messagesContainer');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}`;
            wrapper.dataset.index = messageIndex;
            
            const time = timestamp || new Date().toLocaleTimeString();
            
            let imageHtml = '';
            if (imageData) {
                imageHtml = `<img src="${imageData}" class="message-image" onclick="window.open(this.src)" alt="Uploaded image">`;
            }
            
            wrapper.innerHTML = `
                <div class="message-bubble">
                    ${imageHtml}
                    ${escapeHtml(content)}
                    <div class="message-time">${time}</div>
                    <div class="message-actions">
                        ${role === 'user' ? `<button onclick="editMessage(${messageIndex})">✏️ Редактировать</button>` : ''}
                        <button onclick="copyMessage(this)">📋 Копировать</button>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function addMessageToCurrentChat(content, role, imageData = null) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                const newMessage = {
                    role: role,
                    content: content,
                    timestamp: new Date().toLocaleTimeString(),
                    image: imageData
                };
                chat.messages.push(newMessage);
                
                if (chat.messages.length === 2 && role === 'user') {
                    chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
                }
                saveChats();
                renderChatList();
                renderMessage(content, role, newMessage.timestamp, chat.messages.length - 1, imageData);
            }
        }

        function editMessage(index) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat && chat.messages[index] && chat.messages[index].role === 'user') {
                editingMessageIndex = index;
                document.getElementById('editText').value = chat.messages[index].content;
                document.getElementById('editModal').style.display = 'flex';
            }
        }

        function saveEditedMessage() {
            const newText = document.getElementById('editText').value.trim();
            if (newText && editingMessageIndex !== null) {
                const chat = chats.find(c => c.id === currentChatId);
                if (chat && chat.messages[editingMessageIndex]) {
                    chat.messages = chat.messages.slice(0, editingMessageIndex);
                    saveChats();
                    loadChat(currentChatId);
                    sendMessageWithText(newText);
                }
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            editingMessageIndex = null;
        }

        function copyMessage(btn) {
            const messageDiv = btn.closest('.message-bubble');
            const text = messageDiv.childNodes[0].textContent;
            navigator.clipboard.writeText(text);
            btn.textContent = '✅ Скопировано';
            setTimeout(() => btn.textContent = '📋 Копировать', 2000);
        }

        async function shareChat() {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                const chatText = chat.messages.map(m => `${m.role === 'user' ? '👤 User' : '🤖 MUZAFFAR'}: ${m.content}`).join('\n\n');
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Чат с MUZAFFAR AI',
                            text: chatText.substring(0, 1000)
                        });
                    } catch(e) {
                        prompt('Скопируйте текст чата:', chatText.substring(0, 2000));
                    }
                } else {
                    prompt('Скопируйте текст чата:', chatText.substring(0, 2000));
                }
            }
        }

        function startVoiceInput() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'ru-RU';
                recognition.continuous = false;
                recognition.interimResults = false;
                
                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    document.getElementById('userInput').value = text;
                    sendMessage();
                };
                
                recognition.start();
            } else {
                alert('Голосовой ввод не поддерживается в вашем браузере');
            }
        }

        function handleImageUpload(input) {
            const file = input.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentImageData = e.target.result;
                    currentImageName = file.name;
                    const previewDiv = document.getElementById('imagePreview');
                    previewDiv.innerHTML = `<img src="${currentImageData}" onclick="window.open(this.src)">`;
                };
                reader.readAsDataURL(file);
            }
        }

        // Анализ изображения через Gemini Vision API
        async function analyzeImageWithGemini(imageData, question) {
            try {
                // Убираем префикс data:image/...;base64,
                const base64Data = imageData.split(',')[1];
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                {
                                    inline_data: {
                                        mime_type: "image/png",
                                        data: base64Data
                                    }
                                },
                                {
                                    text: question || "Опиши подробно, что ты видишь на этом изображении. Расскажи на русском языке."
                                }
                            ]
                        }]
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Gemini API error: ${response.status}`);
                }
                
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (error) {
                console.error('Gemini analysis error:', error);
                return null;
            }
        }

        let isSending = false;

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text && !currentImageData) return;
            sendMessageWithText(text);
            input.value = '';
        }

        async function sendMessageWithText(text = '') {
            if (isSending) return;
            
            isSending = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            let userMessage = text || (currentImageData ? "Проанализируй это изображение" : "");
            let hasImage = currentImageData !== null;
            let imageAnalysis = null;
            
            if (hasImage) {
                addMessageToCurrentChat(`📷 Пользователь загрузил изображение: ${currentImageName || 'image.png'}`, 'user', currentImageData);
                
                // Анализируем изображение через Gemini
                const typingDiv = showTypingIndicator();
                typingDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span> 🔍 Анализирую изображение через Gemini...</div>`;
                
                imageAnalysis = await analyzeImageWithGemini(currentImageData, text);
                
                if (imageAnalysis) {
                    hideTypingIndicator(typingDiv);
                    addMessageToCurrentChat(`🔍 Анализ изображения:\n\n${imageAnalysis}`, 'ai');
                    currentImageData = null;
                    document.getElementById('imagePreview').innerHTML = '';
                    isSending = false;
                    sendBtn.disabled = false;
                    document.getElementById('userInput').focus();
                    return;
                } else {
                    userMessage = text || "Проанализируй изображение";
                }
            }
            
            if (!userMessage && !hasImage) {
                isSending = false;
                sendBtn.disabled = false;
                return;
            }
            
            if (!hasImage) {
                addMessageToCurrentChat(userMessage, 'user');
            }
            
            const typingDiv = showTypingIndicator();
            
            try {
                // Получаем историю сообщений для контекста
                const chat = chats.find(c => c.id === currentChatId);
                const messageHistory = chat.messages.slice(-10).map(m => ({
                    role: m.role === 'user' ? 'user' : 'assistant',
                    content: m.content
                }));
                
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: [
                            {
                                role: "system",
                                content: "Ты MUZAFFAR AI - умный, дружелюбный и подробный ассистент. Отвечай развернуто, с примерами, всегда на русском языке. Будь максимально полезным."
                            },
                            ...messageHistory,
                            {
                                role: "user",
                                content: userMessage
                            }
                        ],
                        temperature: 0.8,
                        max_tokens: 2000
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const reply = data.choices[0].message.content;
                hideTypingIndicator(typingDiv);
                addMessageToCurrentChat(reply, 'ai');
                
            } catch (error) {
                hideTypingIndicator(typingDiv);
                addMessageToCurrentChat(`❌ Ошибка: ${error.message}`, 'ai');
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                currentImageData = null;
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('userInput').focus();
            }
        }
        
        function showTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message-wrapper ai';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span> 🤔 Думаю...</div>`;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
            return typingDiv;
        }
        
        function hideTypingIndicator(element) {
            if (element) element.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Инициализация
        loadChats();
    </script>
</body>
</html>

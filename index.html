<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUZAFFAR AI - Google Gemini</title>
    <style>
        /* ПЕРЕМЕННЫЕ ДЛЯ НАСТРОЙКИ ДИЗАЙНА */
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --accent-primary: #ff6b35;
            --accent-secondary: #f7b733;
            --user-msg-bg: linear-gradient(135deg, #ff6b35, #f7b733);
            --border-radius: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            height: 90vh;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        /* Боковая панель */
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .chat-item.active {
            background: linear-gradient(135deg, rgba(255,107,53,0.2), rgba(247,183,51,0.2));
            border-left: 3px solid var(--accent-primary);
        }

        .chat-item-title {
            color: white;
            font-size: 0.9em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-item-date {
            color: #888;
            font-size: 0.7em;
        }

        .delete-chat {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,0,0,0.5);
            border: none;
            border-radius: 5px;
            padding: 2px 6px;
            color: white;
            cursor: pointer;
            font-size: 0.7em;
            opacity: 0;
        }

        .chat-item:hover .delete-chat {
            opacity: 1;
        }

        /* Основной чат */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .chat-header h1 {
            color: var(--accent-primary);
            font-size: 1.5em;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: var(--user-msg-bg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .ai-message {
            background: rgba(255,255,255,0.1);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        /* Поле ввода */
        .input-area {
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1em;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-primary);
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
        }

        .typing {
            background: rgba(255,255,255,0.1);
            padding: 10px 18px;
            border-radius: 20px;
            align-self: flex-start;
            color: #888;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="logo">MUZAFFAR AI</div>
            <button class="new-chat-btn" onclick="createNewChat()">✨ Новый чат</button>
            <div class="chat-list" id="chatList"></div>
        </div>
        <div class="main-chat">
            <div class="chat-header">
                <h1>🤖 MUZAFFAR AI (Google Gemini)</h1>
                <p style="color: #888; font-size: 0.85em;">Мощный AI с русским языком | Без CORS через Netlify</p>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button id="sendBtn" onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== КОНФИГУРАЦИЯ =====
        // ТВОЙ GOOGLE GEMINI API КЛЮЧ
        const GEMINI_API_KEY = "AIzaSyD_D_ekxQMOnTpUIVO9746G8RRCxvyYAYc";
        const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";
        
        // Хранилище чатов
        let chats = [];
        let currentChatId = null;
        let isSending = false;
        
        // ===== ЗАГРУЗКА И СОХРАНЕНИЕ =====
        function loadChats() {
            const saved = localStorage.getItem('muzaffar_gemini_chats');
            if (saved) {
                chats = JSON.parse(saved);
            }
            if (chats.length === 0) {
                createNewChat();
            } else {
                currentChatId = chats[0].id;
                renderChatList();
                loadChat(currentChatId);
            }
        }
        
        function saveChats() {
            localStorage.setItem('muzaffar_gemini_chats', JSON.stringify(chats));
        }
        
        function createNewChat() {
            const newChat = {
                id: Date.now(),
                title: `Новый чат ${chats.length + 1}`,
                date: new Date().toLocaleString(),
                messages: [
                    { role: 'ai', content: 'Привет! Я MUZAFFAR AI на базе Google Gemini. Задай любой вопрос на русском! 🚀', timestamp: new Date().toLocaleTimeString() }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            renderChatList();
            loadChat(currentChatId);
            showToast('✨ Новый чат создан');
        }
        
        function deleteChat(chatId, event) {
            event.stopPropagation();
            if (chats.length === 1) {
                showToast('❌ Нельзя удалить последний чат');
                return;
            }
            chats = chats.filter(c => c.id !== chatId);
            if (currentChatId === chatId) {
                currentChatId = chats[0].id;
                loadChat(currentChatId);
            }
            saveChats();
            renderChatList();
            showToast('🗑️ Чат удален');
        }
        
        function loadChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            currentChatId = chatId;
            const container = document.getElementById('messages');
            container.innerHTML = '';
            chat.messages.forEach(msg => {
                renderMessage(msg.content, msg.role);
            });
            renderChatList();
        }
        
        function renderMessage(content, role) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user-message' : 'ai-message'}`;
            div.innerText = content;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        function renderChatList() {
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${currentChatId === chat.id ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="chat-item-title">${escapeHtml(chat.title)}</div>
                    <div class="chat-item-date">${chat.date}</div>
                    <button class="delete-chat" onclick="deleteChat(${chat.id}, event)">🗑️</button>
                `;
                div.onclick = () => loadChat(chat.id);
                container.appendChild(div);
            });
        }
        
        function addMessageToChat(content, role) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages.push({
                    role: role,
                    content: content,
                    timestamp: new Date().toLocaleTimeString()
                });
                if (chat.messages.length === 2 && role === 'user') {
                    chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
                }
                saveChats();
                renderMessage(content, role);
                renderChatList();
            }
        }
        
        // ===== ОТПРАВКА СООБЩЕНИЯ В GEMINI =====
        async function sendMessage() {
            if (isSending) return;
            
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            isSending = true;
            input.value = '';
            document.getElementById('sendBtn').disabled = true;
            
            // Добавляем сообщение пользователя
            addMessageToChat(text, 'user');
            
            // Индикатор печати
            const container = document.getElementById('messages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerText = '✍️ MUZAFFAR AI печатает...';
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
            
            try {
                // Формируем историю для Gemini
                const chat = chats.find(c => c.id === currentChatId);
                const history = chat.messages.filter(m => m.role !== 'ai' || m.content !== '✍️ MUZAFFAR AI печатает...').map(m => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.content }]
                }));
                
                // Запрос к Gemini API
                const response = await fetch(`${GEMINI_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: history,
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 800,
                            topP: 0.95
                        }
                    })
                });
                
                typingDiv.remove();
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                addMessageToChat(reply, 'ai');
                
            } catch (error) {
                typingDiv.remove();
                console.error('Gemini Error:', error);
                let errorMsg = `❌ Ошибка: ${error.message}`;
                if (error.message.includes('API key')) {
                    errorMsg = '❌ Неверный API ключ. Проверь ключ Gemini.';
                } else if (error.message.includes('fetch')) {
                    errorMsg = '❌ Ошибка соединения. Залей этот файл на Netlify - там CORS не будет!';
                }
                addMessageToChat(errorMsg, 'ai');
            } finally {
                isSending = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Инициализация
        loadChats();
    </script>
</body>
</html>

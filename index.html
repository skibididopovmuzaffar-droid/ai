<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUZAFFAR AI - Google Gemini 2.0</title>
    <style>
        /* ===== НАСТРОЙКИ ДИЗАЙНА - МЕНЯЙ ПОД СЕБЯ ===== */
        :root {
            --bg-primary: #0f0c29;
            --bg-secondary: #1a1a2e;
            --bg-sidebar: rgba(0, 0, 0, 0.4);
            --accent-primary: #ff6b35;
            --accent-secondary: #f7b733;
            --user-msg-bg: linear-gradient(135deg, #ff6b35, #f7b733);
            --ai-msg-bg: rgba(255, 255, 255, 0.08);
            --text-light: #ffffff;
            --text-gray: #aaaaaa;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-radius: 28px;
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Контейнер чата */
        .chat-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            height: 90vh;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        /* ===== БОКОВАЯ ПАНЕЛЬ (ИСТОРИЯ ЧАТОВ) ===== */
        .sidebar {
            width: 300px;
            background: var(--bg-sidebar);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.8em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            padding: 14px;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 25px;
            transition: all 0.2s;
            font-size: 1em;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.3);
        }

        .chat-history-title {
            color: var(--text-gray);
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-item.active {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(247, 183, 51, 0.2));
            border-left: 3px solid var(--accent-primary);
        }

        .chat-item-title {
            color: var(--text-light);
            font-size: 0.9em;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 25px;
        }

        .chat-item-date {
            color: var(--text-gray);
            font-size: 0.7em;
            margin-top: 4px;
        }

        .delete-chat {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 50, 50, 0.6);
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            color: white;
            cursor: pointer;
            font-size: 0.7em;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-item:hover .delete-chat {
            opacity: 1;
        }

        .delete-chat:hover {
            background: rgba(255, 50, 50, 1);
        }

        /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 25px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
        }

        .chat-header h1 {
            color: var(--accent-primary);
            font-size: 1.4em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header p {
            color: var(--text-gray);
            font-size: 0.8em;
            margin-top: 5px;
        }

        /* ===== СООБЩЕНИЯ ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 20px;
            border-radius: 24px;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: var(--user-msg-bg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .ai-message {
            background: var(--ai-msg-bg);
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            border: 1px solid var(--border-color);
        }

        /* Кнопки действий над сообщением */
        .message-actions {
            position: absolute;
            top: -30px;
            right: 0;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        .message-wrapper:hover .message-actions {
            opacity: 1;
        }

        .message-actions button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            padding: 4px 8px;
            border-radius: 5px;
        }

        .message-actions button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .edit-btn { color: #ffc107; }
        .copy-btn { color: #17a2b8; }

        .message-time {
            font-size: 0.7em;
            margin-top: 6px;
            opacity: 0.6;
        }

        /* Индикатор печати */
        .typing {
            background: var(--ai-msg-bg);
            padding: 10px 18px;
            border-radius: 20px;
            align-self: flex-start;
            color: var(--text-gray);
            font-size: 0.9em;
            border: 1px solid var(--border-color);
        }

        /* ===== ПОЛЕ ВВОДА ===== */
        .input-area {
            padding: 20px 25px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            padding: 14px 22px;
            border: 2px solid var(--border-color);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 1em;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.12);
        }

        input::placeholder {
            color: #666;
        }

        button {
            padding: 14px 30px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== ДРУГОЕ ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            font-size: 0.9em;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .message {
                max-width: 88%;
            }
            .chat-header h1 {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Боковая панель с историей -->
        <div class="sidebar">
            <div class="logo">MUZAFFAR AI</div>
            <button class="new-chat-btn" onclick="createNewChat()">✨ Новый чат</button>
            <div class="chat-history-title">ИСТОРИЯ ЧАТОВ</div>
            <div class="chat-list" id="chatList"></div>
        </div>

        <!-- Основная область чата -->
        <div class="main-chat">
            <div class="chat-header">
                <h1>🤖 MUZAFFAR AI</h1>
                <p>Google Gemini 2.0 Flash | Мощный AI с русским языком | Работает на Netlify</p>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button id="sendBtn" onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // НАСТРОЙКИ - ТВОЙ НОВЫЙ API КЛЮЧ
        // ============================================================
        const GEMINI_API_KEY = "AIzaSyDAwUkpfWvcEc-DHppuiL3l7f75UsxY6vM";
        const MODEL_NAME = "gemini-2.0-flash-exp";
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent`;
        
        // Переменные приложения
        let chats = [];
        let currentChatId = null;
        let isSending = false;
        
        // ============================================================
        // УПРАВЛЕНИЕ ЧАТАМИ (сохранение в localStorage)
        // ============================================================
        function loadChats() {
            try {
                const saved = localStorage.getItem('muzaffar_ai_chats');
                if (saved) {
                    chats = JSON.parse(saved);
                }
            } catch(e) { console.error('Ошибка загрузки:', e); }
            
            if (!chats || chats.length === 0) {
                createNewChat();
            } else {
                currentChatId = chats[0].id;
                renderChatList();
                loadChat(currentChatId);
            }
        }
        
        function saveChats() {
            try {
                localStorage.setItem('muzaffar_ai_chats', JSON.stringify(chats));
            } catch(e) { console.error('Ошибка сохранения:', e); }
        }
        
        function createNewChat() {
            const newChat = {
                id: Date.now(),
                title: `Новый чат ${chats.length + 1}`,
                date: new Date().toLocaleString('ru-RU'),
                messages: [
                    { 
                        id: Date.now(),
                        role: 'ai', 
                        content: 'Привет! Я MUZAFFAR AI на Google Gemini 2.0. Задай любой вопрос на русском! 🚀', 
                        timestamp: new Date().toLocaleTimeString('ru-RU'),
                        editable: false
                    }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            renderChatList();
            loadChat(currentChatId);
            showToast('✨ Новый чат создан');
        }
        
        function deleteChat(chatId, event) {
            event.stopPropagation();
            if (chats.length === 1) {
                showToast('❌ Нельзя удалить последний чат');
                return;
            }
            chats = chats.filter(c => c.id !== chatId);
            if (currentChatId === chatId) {
                currentChatId = chats[0].id;
                loadChat(currentChatId);
            }
            saveChats();
            renderChatList();
            showToast('🗑️ Чат удален');
        }
        
        function loadChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            currentChatId = chatId;
            const container = document.getElementById('messages');
            container.innerHTML = '';
            chat.messages.forEach(msg => {
                renderMessage(msg.content, msg.role, msg.timestamp, msg.id);
            });
            renderChatList();
        }
        
        // ============================================================
        // ОТОБРАЖЕНИЕ СООБЩЕНИЙ
        // ============================================================
        function renderMessage(content, role, timestamp = null, msgId = null) {
            const container = document.getElementById('messages');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper`;
            const time = timestamp || new Date().toLocaleTimeString('ru-RU');
            const id = msgId || Date.now();
            
            wrapper.innerHTML = `
                <div class="message ${role === 'user' ? 'user-message' : 'ai-message'}">
                    ${escapeHtml(content)}
                    <div class="message-time">${time}</div>
                    <div class="message-actions">
                        ${role === 'user' ? `<button class="edit-btn" onclick="editMessage(${id})">✏️</button>` : ''}
                        <button class="copy-btn" onclick="copyMessage('${escapeHtml(content).replace(/'/g, "\\'")}')">📋</button>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }
        
        function addMessageToChat(content, role, msgId = null) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                const newMsg = {
                    id: msgId || Date.now(),
                    role: role,
                    content: content,
                    timestamp: new Date().toLocaleTimeString('ru-RU'),
                    editable: role === 'user'
                };
                chat.messages.push(newMsg);
                
                // Обновляем заголовок чата (по первому сообщению пользователя)
                if (chat.messages.length === 2 && role === 'user') {
                    chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
                    chat.date = new Date().toLocaleString('ru-RU');
                }
                saveChats();
                renderChatList();
                renderMessage(content, role, newMsg.timestamp, newMsg.id);
            }
        }
        
        function renderChatList() {
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${currentChatId === chat.id ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="chat-item-title">${escapeHtml(chat.title)}</div>
                    <div class="chat-item-date">${chat.date}</div>
                    <button class="delete-chat" onclick="deleteChat(${chat.id}, event)">🗑️</button>
                `;
                div.onclick = () => loadChat(chat.id);
                container.appendChild(div);
            });
        }
        
        // ============================================================
        // РЕДАКТИРОВАНИЕ И КОПИРОВАНИЕ СООБЩЕНИЙ
        // ============================================================
        function editMessage(msgId) {
            const chat = chats.find(c => c.id === currentChatId);
            const msgIndex = chat.messages.findIndex(m => m.id === msgId);
            if (msgIndex === -1 || chat.messages[msgIndex].role !== 'user') return;
            
            const newContent = prompt('Редактировать сообщение:', chat.messages[msgIndex].content);
            if (newContent && newContent.trim() && newContent !== chat.messages[msgIndex].content) {
                // Обновляем сообщение
                chat.messages[msgIndex].content = newContent;
                // Удаляем все следующие сообщения (ответы AI)
                chat.messages = chat.messages.slice(0, msgIndex + 1);
                saveChats();
                loadChat(currentChatId);
                // Отправляем новое сообщение
                sendMessageWithText(newContent);
            }
        }
        
        function copyMessage(text) {
            navigator.clipboard.writeText(text);
            showToast('📋 Сообщение скопировано');
        }
        
        // ============================================================
        // ОТПРАВКА СООБЩЕНИЙ В GOOGLE GEMINI
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text || isSending) return;
            await sendMessageWithText(text);
            input.value = '';
        }
        
        async function sendMessageWithText(text) {
            if (isSending) return;
            isSending = true;
            document.getElementById('sendBtn').disabled = true;
            
            addMessageToChat(text, 'user');
            
            // Показываем индикатор печати
            const container = document.getElementById('messages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerText = '✍️ MUZAFFAR AI печатает...';
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
            
            try {
                const requestBody = {
                    contents: [
                        {
                            role: "user",
                            parts: [{ text: text }]
                        }
                    ],
                    generationConfig: {
                        temperature: 0.8,
                        maxOutputTokens: 1000,
                        topP: 0.95,
                        topK: 40
                    },
                    safetySettings: [
                        { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                    ]
                };
                
                const response = await fetch(`${GEMINI_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                typingDiv.remove();
                
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('API Error:', errorData);
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) {
                    throw new Error('Пустой ответ от API');
                }
                
                const reply = data.candidates[0].content.parts[0].text;
                addMessageToChat(reply, 'ai');
                
            } catch (error) {
                typingDiv.remove();
                console.error('Error:', error);
                
                let errorMsg = `❌ ${error.message}`;
                if (error.message.includes('API key') || error.message.includes('quota')) {
                    errorMsg = '❌ Проблема с API ключом. Проверь ключ в Google AI Studio.';
                } else if (error.message.includes('fetch')) {
                    errorMsg = '❌ Ошибка соединения. Залей этот файл на Netlify - там CORS не будет!';
                } else if (error.message.includes('not found')) {
                    errorMsg = '❌ Модель временно недоступна. Пробуем gemini-1.5-flash...';
                    // Пробуем альтернативную модель
                    await tryAlternativeModel(text);
                    return;
                }
                addMessageToChat(errorMsg, 'ai');
            } finally {
                isSending = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('userInput').focus();
            }
        }
        
        // Альтернативная модель на случай ошибки
        async function tryAlternativeModel(text) {
            const altModel = "gemini-1.5-flash";
            const altUrl = `https://generativelanguage.googleapis.com/v1beta/models/${altModel}:generateContent`;
            
            try {
                const response = await fetch(`${altUrl}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: text }] }],
                        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
                    })
                });
                
                if (!response.ok) throw new Error('Alternative model failed');
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                addMessageToChat(reply, 'ai');
            } catch (err) {
                addMessageToChat(`❌ Все модели недоступны. Проверь API ключ в https://aistudio.google.com/`, 'ai');
            }
        }
        
        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // ============================================================
        // ЗАПУСК
        // ============================================================
        loadChats();
    </script>
</body>
</html>

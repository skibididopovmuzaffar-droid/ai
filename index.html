<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Полная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Контейнер чата */
        .chat-app {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Боковая панель */
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #00ff88, #00bfff);
            border: none;
            padding: 14px 20px;
            border-radius: 16px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }

        .chat-history-title {
            color: #888;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
            color: #ddd;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-item.active {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 191, 255, 0.2));
            border-left: 3px solid #00ff88;
            color: white;
        }

        .chat-item-title {
            font-weight: 500;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-item-date {
            font-size: 0.7em;
            color: #888;
        }

        /* Основная область чата */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header h2 {
            color: #00ff88;
            font-size: 1.3em;
        }

        .chat-header p {
            color: #888;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Стили сообщений */
        .message-wrapper {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message-wrapper.ai {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 20px;
            border-radius: 24px;
            line-height: 1.5;
            position: relative;
        }

        .user .message-bubble {
            background: linear-gradient(135deg, #007bff, #00bfff);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .ai .message-bubble {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-bottom-left-radius: 6px;
            backdrop-filter: blur(5px);
        }

        .message-time {
            font-size: 0.7em;
            margin-top: 5px;
            opacity: 0.7;
        }

        /* Индикатор печати */
        .typing-indicator {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 24px;
            display: inline-flex;
            gap: 4px;
            backdrop-filter: blur(5px);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* Поле ввода */
        .input-area {
            padding: 20px 30px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }

        .input-area input:focus {
            border-color: #00ff88;
            background: rgba(255, 255, 255, 0.15);
        }

        .input-area input::placeholder {
            color: #888;
        }

        .input-area button {
            padding: 14px 32px;
            background: linear-gradient(135deg, #00ff88, #00bfff);
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #1a1a2e;
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 4px;
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <!-- Боковая панель с историей -->
        <div class="sidebar">
            <button class="new-chat-btn" onclick="createNewChat()">
                ✨ Новый чат
            </button>
            <div class="chat-history-title">История чатов</div>
            <div class="chat-list" id="chatList">
                <!-- Чаты будут динамически добавляться -->
            </div>
        </div>

        <!-- Основная область -->
        <div class="main-chat">
            <div class="chat-header">
                <h2>🤖 Groq AI Assistant</h2>
                <p>Модель: llama-3.3-70b-versatile | Мощный и умный AI</p>
            </div>
            <div class="messages-container" id="messagesContainer">
                <!-- Сообщения будут здесь -->
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация
        const API_KEY = "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";
        const MODEL = "llama-3.3-70b-versatile";
        
        // Хранилище чатов
        let chats = [];
        let currentChatId = null;
        
        // Загрузка сохраненных чатов
        function loadChats() {
            const saved = localStorage.getItem('ai_chats');
            if (saved) {
                chats = JSON.parse(saved);
            }
            if (chats.length === 0) {
                createNewChat();
            } else {
                currentChatId = chats[0].id;
                renderChatList();
                loadChat(currentChatId);
            }
        }
        
        // Сохранение чатов
        function saveChats() {
            localStorage.setItem('ai_chats', JSON.stringify(chats));
        }
        
        // Создание нового чата
        function createNewChat() {
            const newChat = {
                id: Date.now(),
                title: `Чат ${chats.length + 1}`,
                date: new Date().toLocaleString(),
                messages: [
                    { role: 'ai', content: 'Привет! Я AI ассистент на Groq. Чем могу помочь? 🚀', timestamp: new Date().toLocaleTimeString() }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            renderChatList();
            loadChat(currentChatId);
        }
        
        // Загрузка чата
        function loadChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            
            currentChatId = chatId;
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            chat.messages.forEach(msg => {
                renderMessage(msg.content, msg.role, msg.timestamp);
            });
            
            // Обновляем активный чат в списке
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id == chatId) {
                    item.classList.add('active');
                }
            });
        }
        
        // Рендер списка чатов
        function renderChatList() {
            const listContainer = document.getElementById('chatList');
            listContainer.innerHTML = '';
            
            chats.forEach(chat => {
                const chatDiv = document.createElement('div');
                chatDiv.className = `chat-item ${currentChatId === chat.id ? 'active' : ''}`;
                chatDiv.dataset.id = chat.id;
                chatDiv.onclick = () => loadChat(chat.id);
                
                chatDiv.innerHTML = `
                    <div class="chat-item-title">${chat.title}</div>
                    <div class="chat-item-date">${chat.date}</div>
                `;
                listContainer.appendChild(chatDiv);
            });
        }
        
        // Рендер одного сообщения
        function renderMessage(content, role, timestamp = null) {
            const container = document.getElementById('messagesContainer');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}`;
            
            const time = timestamp || new Date().toLocaleTimeString();
            
            wrapper.innerHTML = `
                <div class="message-bubble">
                    ${escapeHtml(content)}
                    <div class="message-time">${time}</div>
                </div>
            `;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }
        
        // Добавление сообщения в текущий чат
        function addMessageToCurrentChat(content, role) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages.push({
                    role: role,
                    content: content,
                    timestamp: new Date().toLocaleTimeString()
                });
                // Обновляем заголовок чата (первое сообщение пользователя)
                if (chat.messages.length === 2 && role === 'user') {
                    chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
                }
                saveChats();
                renderChatList();
                renderMessage(content, role);
            }
        }
        
        // Отправка сообщения
        let isSending = false;
        
        async function sendMessage() {
            if (isSending) return;
            
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            isSending = true;
            input.value = '';
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            // Добавляем сообщение пользователя
            addMessageToCurrentChat(text, 'user');
            
            // Показываем индикатор печати
            const container = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message-wrapper ai';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
            
            try {
                // Запрос к Groq API
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            {
                                role: "system",
                                content: "Ты дружелюбный, умный и подробный AI ассистент. Отвечай развернуто, с примерами где нужно, всегда на русском языке. Будь полезным и информативным."
                            },
                            ...chats.find(c => c.id === currentChatId).messages.filter(m => m.role !== 'ai').map(m => ({
                                role: m.role === 'user' ? 'user' : 'assistant',
                                content: m.content
                            }))
                        ],
                        temperature: 0.8,
                        max_tokens: 1000  // Увеличил для полных ответов
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const reply = data.choices[0].message.content;
                
                // Удаляем индикатор печати
                typingDiv.remove();
                
                // Добавляем ответ AI
                addMessageToCurrentChat(reply, 'ai');
                
            } catch (error) {
                typingDiv.remove();
                console.error('Error:', error);
                let errorMsg = `❌ Ошибка: ${error.message}`;
                if (error.message.includes('decommissioned')) {
                    errorMsg = '❌ Модель устарела. Пожалуйста, обновите модель в коде.';
                } else if (error.message.includes('CORS') || error.message.includes('fetch')) {
                    errorMsg = '❌ Проблема с соединением.\n\n📌 РЕШЕНИЕ:\n• Используйте браузер Brave\n• Или установите расширение "Allow CORS" в Chrome';
                }
                addMessageToCurrentChat(errorMsg, 'ai');
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }
        
        // Защита от XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Инициализация
        loadChats();
    </script>
</body>
</html>

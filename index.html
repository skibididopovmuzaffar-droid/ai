<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUZAFFAR AI - Ваш персональный ассистент</title>
    <style>
        /* ========== НАСТРОЙКИ ДИЗАЙНА (CSS ПЕРЕМЕННЫЕ) ========== */
        :root {
            /* Основные цвета - МОЖНО МЕНЯТЬ ПОД СЕБЯ */
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-sidebar: rgba(0, 0, 0, 0.3);
            --accent-primary: #ff6b35;
            --accent-secondary: #f7b733;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --user-msg-bg: linear-gradient(135deg, #ff6b35, #f7b733);
            --ai-msg-bg: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            --border-radius: 32px;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* ========== ОСНОВНЫЕ СТИЛИ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: text; /* Разрешаем выделение текста */
        }
        
        /* Защита от выделения кода */
        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        
        /* Блокировка правой кнопки мыши на некоторых элементах */
        .no-context {
            user-select: none;
            -webkit-user-select: none;
        }
        
        .chat-app {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            display: flex;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        
        /* ========== БОКОВАЯ ПАНЕЛЬ ========== */
        .sidebar {
            width: 300px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .logo {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .new-chat-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            padding: 14px 20px;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.3);
        }
        
        .chat-history-title {
            color: var(--text-secondary);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .chat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .chat-item.active {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(247, 183, 51, 0.2));
            border-left: 3px solid var(--accent-primary);
        }
        
        .chat-item-title {
            font-weight: 500;
            margin-bottom: 5px;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .chat-item-date {
            font-size: 0.7em;
            color: var(--text-secondary);
        }
        
        .delete-chat-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 0, 0, 0.5);
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            color: white;
            cursor: pointer;
            font-size: 0.7em;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }
        
        .delete-chat-btn:hover {
            background: rgba(255, 0, 0, 0.8);
        }
        
        /* ========== ОСНОВНАЯ ОБЛАСТЬ ========== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: var(--bg-sidebar);
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .chat-header h2 {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.5em;
        }
        
        .chat-header p {
            color: var(--text-secondary);
            font-size: 0.85em;
            margin-top: 5px;
        }
        
        /* ========== СООБЩЕНИЯ ========== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message-wrapper {
            display: flex;
            animation: slideIn 0.3s ease;
            position: relative;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-wrapper.user {
            justify-content: flex-end;
        }
        
        .message-wrapper.ai {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 20px;
            border-radius: 24px;
            line-height: 1.5;
            position: relative;
        }
        
        .user .message-bubble {
            background: var(--user-msg-bg);
            color: white;
            border-bottom-right-radius: 6px;
        }
        
        .ai .message-bubble {
            background: var(--ai-msg-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 6px;
            backdrop-filter: blur(5px);
        }
        
        /* Кнопки управления сообщением */
        .message-actions {
            position: absolute;
            top: -30px;
            right: 0;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 20px;
        }
        
        .message-wrapper:hover .message-actions {
            opacity: 1;
        }
        
        .message-actions button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
            padding: 5px;
            border-radius: 5px;
        }
        
        .message-actions button:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .edit-msg-btn { color: #ffc107; }
        .copy-msg-btn { color: #17a2b8; }
        
        /* Редактирование сообщения */
        .edit-input {
            width: 100%;
            background: rgba(255,255,255,0.2);
            border: 2px solid var(--accent-primary);
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            font-family: inherit;
            resize: vertical;
        }
        
        .message-time {
            font-size: 0.7em;
            margin-top: 5px;
            opacity: 0.7;
        }
        
        /* Индикатор печати */
        .typing-indicator {
            background: var(--ai-msg-bg);
            padding: 12px 20px;
            border-radius: 24px;
            display: inline-flex;
            gap: 4px;
            backdrop-filter: blur(5px);
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
        
        /* ========== ПОЛЕ ВВОДА ========== */
        .input-area {
            padding: 20px 30px;
            background: var(--bg-sidebar);
            border-top: 1px solid var(--border-color);
        }
        
        .input-container {
            display: flex;
            gap: 12px;
        }
        
        .voice-btn, .file-btn {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2em;
        }
        
        .voice-btn:hover, .file-btn:hover {
            background: var(--accent-primary);
        }
        
        .voice-btn.recording {
            background: #ff4444;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
            outline: none;
        }
        
        .input-area input:focus {
            border-color: var(--accent-primary);
        }
        
        .input-area button {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        
        .share-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        
        .share-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            color: white;
        }
        
        .share-btn:hover {
            background: var(--accent-primary);
        }
        
        /* Предпросмотр файлов */
        .file-preview {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            display: none;
        }
        
        /* Всплывающие уведомления */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* Защита кода - водяные знаки */
        .watermark {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
            z-index: 9999;
        }
        
        /* Скроллбар */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 4px; }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message-bubble { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <div class="sidebar">
            <div class="logo">MUZAFFAR AI</div>
            <button class="new-chat-btn" onclick="createNewChat()">✨ Новый чат</button>
            <div class="chat-history-title">История чатов</div>
            <div class="chat-list" id="chatList"></div>
        </div>
        
        <div class="main-chat">
            <div class="chat-header">
                <h2>🤖 MUZAFFAR AI</h2>
                <p>Ваш персональный ассистент | Мощный и умный AI</p>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <div class="input-container">
                    <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceInput()" title="Голосовой ввод">🎤</button>
                    <button class="file-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить файл">📎</button>
                    <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button id="sendBtn" onclick="sendMessage()">Отправить</button>
                </div>
                <div class="share-container">
                    <button class="share-btn" onclick="shareChatAsJSON()">📤 Поделиться чатом (JSON)</button>
                    <button class="share-btn" onclick="exportChatAsText()">📄 Экспорт в TXT</button>
                    <button class="share-btn" onclick="copyChatLink()">🔗 Скопировать ссылку</button>
                </div>
                <div class="file-preview" id="filePreview"></div>
                <input type="file" id="fileInput" style="display:none" multiple accept="image/*,.txt,.pdf,.docx" onchange="handleFiles(this.files)">
            </div>
        </div>
    </div>
    <div class="watermark">MUZAFFAR AI | Защищено</div>

    <script>
        // ========== ЗАЩИТА КОДА ==========
        // Блокировка некоторых клавиш
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c' && e.target.tagName !== 'INPUT')) {
                e.preventDefault();
                showToast('🔒 Доступ запрещен');
            }
            if (e.key === 'F12') {
                e.preventDefault();
                showToast('🔒 Инструменты разработчика отключены');
            }
        });
        
        // Блокировка правой кнопки мыши на важных элементах
        document.querySelectorAll('.chat-app, .message-bubble, .sidebar').forEach(el => {
            el.addEventListener('contextmenu', (e) => {
                if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    return false;
                }
            });
        });
        
        // ========== КОНФИГУРАЦИЯ ==========
        const API_KEY = "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";
        const MODEL = "llama-3.3-70b-versatile";
        
        let chats = [];
        let currentChatId = null;
        let isSending = false;
        let mediaRecorder = null;
        let audioChunks = [];
        
        // ========== ФУНКЦИИ ЧАТА ==========
        function loadChats() {
            const saved = localStorage.getItem('muzaffar_chats');
            if (saved) {
                chats = JSON.parse(saved);
            }
            if (chats.length === 0) {
                createNewChat();
            } else {
                currentChatId = chats[0].id;
                renderChatList();
                loadChat(currentChatId);
            }
        }
        
        function saveChats() {
            localStorage.setItem('muzaffar_chats', JSON.stringify(chats));
        }
        
        function createNewChat() {
            const newChat = {
                id: Date.now(),
                title: `Новый чат ${chats.length + 1}`,
                date: new Date().toLocaleString(),
                messages: [
                    { id: Date.now(), role: 'ai', content: 'Привет! Я MUZAFFAR AI. Чем могу помочь? 🚀', timestamp: new Date().toLocaleTimeString(), editable: false }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            renderChatList();
            loadChat(currentChatId);
            showToast('✨ Новый чат создан');
        }
        
        function deleteChat(chatId, event) {
            event.stopPropagation();
            if (chats.length === 1) {
                showToast('❌ Нельзя удалить последний чат');
                return;
            }
            chats = chats.filter(c => c.id !== chatId);
            if (currentChatId === chatId) {
                currentChatId = chats[0].id;
                loadChat(currentChatId);
            }
            saveChats();
            renderChatList();
            showToast('🗑️ Чат удален');
        }
        
        function loadChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            currentChatId = chatId;
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            chat.messages.forEach(msg => {
                renderMessage(msg.content, msg.role, msg.timestamp, msg.id);
            });
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id == chatId) item.classList.add('active');
            });
        }
        
        function renderMessage(content, role, timestamp = null, msgId = null) {
            const container = document.getElementById('messagesContainer');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}`;
            const time = timestamp || new Date().toLocaleTimeString();
            const id = msgId || Date.now();
            
            wrapper.innerHTML = `
                <div class="message-bubble">
                    <div class="message-content">${escapeHtml(content)}</div>
                    <div class="message-time">${time}</div>
                </div>
                <div class="message-actions">
                    ${role === 'user' ? `<button class="edit-msg-btn" onclick="editMessage(${id})">✏️</button>` : ''}
                    <button class="copy-msg-btn" onclick="copyMessage('${escapeHtml(content).replace(/'/g, "\\'")}')">📋</button>
                </div>
            `;
            wrapper.querySelector('.message-bubble').dataset.msgId = id;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }
        
        function editMessage(msgId) {
            const chat = chats.find(c => c.id === currentChatId);
            const msg = chat.messages.find(m => m.id === msgId);
            if (!msg || msg.role !== 'user') return;
            
            const newContent = prompt('Редактировать сообщение:', msg.content);
            if (newContent && newContent.trim()) {
                msg.content = newContent;
                saveChats();
                loadChat(currentChatId);
                // Автоматически отправляем новую версию
                sendMessageWithText(newContent);
            }
        }
        
        function copyMessage(text) {
            navigator.clipboard.writeText(text);
            showToast('📋 Сообщение скопировано');
        }
        
        function addMessageToCurrentChat(content, role, msgId = null) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                const newMsg = {
                    id: msgId || Date.now(),
                    role: role,
                    content: content,
                    timestamp: new Date().toLocaleTimeString(),
                    editable: role === 'user'
                };
                chat.messages.push(newMsg);
                if (chat.messages.length === 2 && role === 'user') {
                    chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
                }
                saveChats();
                renderChatList();
                renderMessage(content, role, newMsg.timestamp, newMsg.id);
            }
        }
        
        // ========== ОТПРАВКА СООБЩЕНИЙ ==========
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text || isSending) return;
            await sendMessageWithText(text);
            input.value = '';
        }
        
        async function sendMessageWithText(text) {
            if (isSending) return;
            isSending = true;
            
            addMessageToCurrentChat(text, 'user');
            
            const container = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message-wrapper ai';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
            
            try {
                const chat = chats.find(c => c.id === currentChatId);
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            { role: "system", content: "Ты MUZAFFAR AI - дружелюбный, умный ассистент. Отвечай развернуто на русском языке. Будь полезным." },
                            ...chat.messages.filter(m => m.role !== 'ai').map(m => ({
                                role: m.role === 'user' ? 'user' : 'assistant',
                                content: m.content
                            }))
                        ],
                        temperature: 0.8,
                        max_tokens: 1000
                    })
                });
                
                typingDiv.remove();
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMessageToCurrentChat(reply, 'ai');
                
            } catch (error) {
                typingDiv.remove();
                addMessageToCurrentChat(`❌ Ошибка: ${error.message}`, 'ai');
            } finally {
                isSending = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }
        
        // ========== ГОЛОСОВОЙ ВВОД ==========
        let recognition = null;
        let isRecording = false;
        
        function toggleVoiceInput() {
            if (!('webkitSpeechRecognition' in window)) {
                showToast('❌ Голосовой ввод не поддерживается в этом браузере');
                return;
            }
            
            if (isRecording) {
                stopVoiceInput();
                return;
            }
            
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('voiceBtn').classList.add('recording');
                showToast('🎤 Говорите...');
            };
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                showToast(`📝 Распознано: ${text}`);
                stopVoiceInput();
            };
            
            recognition.onerror = (event) => {
                console.error('Voice error:', event.error);
                showToast('❌ Ошибка распознавания');
                stopVoiceInput();
            };
            
            recognition.onend = () => {
                stopVoiceInput();
            };
            
            recognition.start();
        }
        
        function stopVoiceInput() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            isRecording = false;
            document.getElementById('voiceBtn')?.classList.remove('recording');
        }
        
        // ========== ЗАГРУЗКА ФАЙЛОВ ==========
        function handleFiles(files) {
            const preview = document.getElementById('filePreview');
            preview.innerHTML = '';
            preview.style.display = 'block';
            
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.innerHTML += `<img src="${e.target.result}" style="max-width: 100px; max-height: 100px; margin: 5px; border-radius: 10px;">`;
                    };
                    reader.readAsDataURL(file);
                } else {
                    preview.innerHTML += `<div>📄 ${file.name}</div>`;
                }
            });
            
            showToast(`📎 Загружено ${files.length} файлов`);
        }
        
        // ========== ЭКСПОРТ И ШАРИНГ ==========
        function exportChatAsText() {
            const chat = chats.find(c => c.id === currentChatId);
            let text = `MUZAFFAR AI - Чат от ${chat.date}\n\n`;
            chat.messages.forEach(msg => {
                text += `${msg.role === 'user' ? '👤 Пользователь' : '🤖 MUZAFFAR AI'} (${msg.timestamp}):\n${msg.content}\n\n---\n\n`;
            });
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `muzaffar_chat_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📄 Чат экспортирован');
        }
        
        function shareChatAsJSON() {
            const chat = chats.find(c => c.id === currentChatId);
            const json = JSON.stringify(chat, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `muzaffar_chat_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 JSON чата сохранен');
        }
        
        function copyChatLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url);
            showToast('🔗 Ссылка на чат скопирована');
        }
        
        function renderChatList() {
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            chats.forEach(chat => {
                const chatDiv = document.createElement('div');
                chatDiv.className = `chat-item ${currentChatId === chat.id ? 'active' : ''}`;
                chatDiv.dataset.id = chat.id;
                chatDiv.onclick = () => loadChat(chat.id);
                chatDiv.innerHTML = `
                    <div class="chat-item-title">${escapeHtml(chat.title)}</div>
                    <div class="chat-item-date">${chat.date}</div>
                    <button class="delete-chat-btn" onclick="deleteChat(${chat.id}, event)">🗑️</button>
                `;
                container.appendChild(chatDiv);
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        loadChats();
        
        // Блокировка F12 и других клавиш разработчика
        document.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('input, textarea, [contenteditable="true"]')) {
                e.preventDefault();
                return false;
            }
        });
        
        // Предупреждение о защите
        console.log('%c🔒 MUZAFFAR AI - Все права защищены', 'color: #ff6b35; font-size: 16px; font-weight: bold;');
        console.log('%cКод защищен от копирования', 'color: #888;');
    </script>
</body>
</html>

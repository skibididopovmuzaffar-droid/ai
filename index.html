<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MUZAFFAR AI Pro - Ассистент с анализом изображений и подсветкой кода</title>
    <!-- Подключение highlight.js для подсветки кода -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
    <style>
        /* ========== ТЕМНАЯ ТЕМА (ЧЁРНЫЙ ФОН, БЕЛЫЙ ТЕКСТ) ========== */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0f0f0f;
            --bg-sidebar: #141414;
            --accent-primary: #00ff88;
            --accent-secondary: #00cc66;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --user-msg-bg: #00ff88;
            --user-msg-text: #0a0a0a;
            --ai-msg-bg: #1a1a1a;
            --border-color: #2a2a2a;
            --shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            --border-radius: 24px;
            --font-family: 'Segoe UI', 'Roboto', 'Monaco', 'Menlo', monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        
        .chat-app {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            display: flex;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        
        /* ========== БОКОВАЯ ПАНЕЛЬ ========== */
        .sidebar {
            width: 300px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .logo {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .new-chat-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            padding: 14px 20px;
            border-radius: 16px;
            color: var(--bg-primary);
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }
        
        .chat-history-title {
            color: var(--text-secondary);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .chat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .chat-item.active {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 204, 102, 0.2));
            border-left: 3px solid var(--accent-primary);
        }
        
        .chat-item-title {
            font-weight: 500;
            margin-bottom: 5px;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 40px;
        }
        
        .chat-item-date {
            font-size: 0.7em;
            color: var(--text-secondary);
        }
        
        .delete-chat-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 0, 0, 0.5);
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            color: white;
            cursor: pointer;
            font-size: 0.7em;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }
        
        .delete-chat-btn:hover {
            background: rgba(255, 0, 0, 0.8);
        }
        
        /* ========== ОСНОВНАЯ ОБЛАСТЬ ========== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: var(--bg-sidebar);
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .chat-header h2 {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.5em;
        }
        
        .chat-header p {
            color: var(--text-secondary);
            font-size: 0.85em;
            margin-top: 5px;
        }
        
        /* ========== СООБЩЕНИЯ ========== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message-wrapper {
            display: flex;
            animation: slideIn 0.3s ease;
            position: relative;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-wrapper.user {
            justify-content: flex-end;
        }
        
        .message-wrapper.ai {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 80%;
            padding: 12px 20px;
            border-radius: 24px;
            line-height: 1.5;
            position: relative;
        }
        
        .user .message-bubble {
            background: var(--user-msg-bg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 6px;
        }
        
        .ai .message-bubble {
            background: var(--ai-msg-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border-color);
        }
        
        /* Стили для кода в сообщениях */
        .message-content pre {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 12px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid #2a2a2a;
        }
        
        .message-content code {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .message-content pre code {
            background: none;
            padding: 0;
        }
        
        /* Кнопки управления сообщением */
        .message-actions {
            position: absolute;
            top: -30px;
            right: 0;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 20px;
            z-index: 10;
        }
        
        .message-wrapper:hover .message-actions {
            opacity: 1;
        }
        
        .message-actions button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
            padding: 5px;
            border-radius: 5px;
        }
        
        .message-actions button:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .edit-msg-btn { color: #ffc107; }
        .copy-msg-btn { color: #17a2b8; }
        .copy-code-btn { color: #00ff88; }
        
        /* Изображения в сообщениях */
        .message-images {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        .message-image {
            max-width: 150px;
            max-height: 150px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .message-image:hover {
            transform: scale(1.05);
        }
        
        .message-time {
            font-size: 0.7em;
            margin-top: 8px;
            opacity: 0.7;
        }
        
        /* Индикатор печати */
        .typing-indicator {
            background: var(--ai-msg-bg);
            padding: 12px 20px;
            border-radius: 24px;
            display: inline-flex;
            gap: 4px;
            border: 1px solid var(--border-color);
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
        
        /* ========== ПОЛЕ ВВОДА ========== */
        .input-area {
            padding: 20px 30px;
            background: var(--bg-sidebar);
            border-top: 1px solid var(--border-color);
        }
        
        .input-container {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .voice-btn, .file-btn, .code-btn {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2em;
            color: white;
        }
        
        .voice-btn:hover, .file-btn:hover, .code-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }
        
        .voice-btn.recording {
            background: #ff4444;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .input-container input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1em;
            outline: none;
        }
        
        .input-container input:focus {
            border-color: var(--accent-primary);
        }
        
        .input-container input::placeholder {
            color: var(--text-secondary);
        }
        
        .input-container button {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--bg-primary);
        }
        
        .input-container button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 2px 10px rgba(0, 255, 136, 0.3);
        }
        
        .input-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Превью файлов */
        .file-preview {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        
        .file-preview img {
            max-width: 80px;
            max-height: 80px;
            border-radius: 8px;
        }
        
        .share-container {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .share-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            color: white;
            transition: all 0.2s;
        }
        
        .share-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }
        
        /* Модальное окно для написания кода */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            border: 1px solid var(--accent-primary);
        }
        
        .modal-header {
            padding: 15px 20px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 {
            color: var(--accent-primary);
        }
        
        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .code-input {
            width: 100%;
            min-height: 300px;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-family: monospace;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
        }
        
        .code-options {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .code-options select {
            padding: 8px 12px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
        }
        
        .modal-btn {
            padding: 10px 20px;
            background: var(--accent-primary);
            border: none;
            border-radius: 10px;
            color: var(--bg-primary);
            font-weight: bold;
            cursor: pointer;
        }
        
        /* Всплывающие уведомления */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            max-width: 300px;
            word-wrap: break-word;
            border-left: 3px solid var(--accent-primary);
        }
        
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* Водяной знак */
        .watermark {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 9px;
            color: rgba(255,255,255,0.2);
            pointer-events: none;
            z-index: 9999;
        }
        
        /* Скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 3px; }
        
        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .sidebar { 
                position: fixed;
                left: -280px;
                height: 100%;
                z-index: 100;
                transition: left 0.3s;
                width: 280px;
            }
            .sidebar.open { left: 0; }
            .chat-app { border-radius: 20px; }
            .message-bubble { max-width: 90%; }
            .input-container button { padding: 12px 20px; }
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <div class="sidebar" id="sidebar">
            <div class="logo">MUZAFFAR AI</div>
            <button class="new-chat-btn" onclick="createNewChat()">✨ Новый чат</button>
            <div class="chat-history-title">История чатов</div>
            <div class="chat-list" id="chatList"></div>
        </div>
        
        <div class="main-chat">
            <div class="chat-header">
                <h2>🤖 MUZAFFAR AI Pro</h2>
                <p>Чёрная тема | Подсветка кода | Анализ изображений | Голосовой ввод</p>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <div class="input-container">
                    <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceInput()" title="Голосовой ввод">🎤</button>
                    <button class="file-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить изображение">📎</button>
                    <button class="code-btn" onclick="openCodeModal()" title="Вставить код">{ }</button>
                    <input type="text" id="userInput" placeholder="Напишите сообщение, вставьте код или опишите изображение..." onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button id="sendBtn" onclick="sendMessage()">Отправить</button>
                </div>
                <div class="share-container">
                    <button class="share-btn" onclick="exportChatAsText()">📄 Экспорт в TXT</button>
                    <button class="share-btn" onclick="shareChatAsJSON()">📤 Поделиться JSON</button>
                    <button class="share-btn" onclick="copyChatLink()">🔗 Ссылка на чат</button>
                    <button class="share-btn" onclick="clearAllChats()">🗑️ Очистить всё</button>
                </div>
                <div class="file-preview" id="filePreview"></div>
                <input type="file" id="fileInput" style="display:none" accept="image/*" multiple onchange="handleFiles(this.files)">
            </div>
        </div>
    </div>
    
    <!-- Модальное окно для кода -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📝 Вставка кода</h3>
                <button class="modal-close" onclick="closeCodeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <textarea class="code-input" id="codeInput" placeholder="Вставьте ваш код здесь..."></textarea>
                <div class="code-options">
                    <select id="codeLanguage">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="json">JSON</option>
                        <option value="bash">Bash</option>
                        <option value="sql">SQL</option>
                        <option value="typescript">TypeScript</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="csharp">C#</option>
                        <option value="php">PHP</option>
                        <option value="ruby">Ruby</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                    </select>
                    <button class="modal-btn" onclick="insertCode()">Вставить код в чат</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="watermark">MUZAFFAR AI Pro | Подсветка кода | Чёрная тема</div>

    <script>
        // ========== ЗАЩИТА ОТ КОПИРОВАНИЯ ==========
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                showToast('🔒 Доступ к коду ограничен');
            }
            if (e.key === 'F12') {
                e.preventDefault();
                showToast('🔒 Инструменты разработчика отключены');
            }
        });
        
        // ========== КОНФИГУРАЦИЯ ==========
        const API_KEY = "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";
        const VISION_MODEL = "llama-4-scout-17b-16e-instruct";
        const TEXT_MODEL = "llama-3.3-70b-versatile";
        
        let chats = [];
        let currentChatId = null;
        let isSending = false;
        let currentImages = [];
        
        // ========== ХРАНЕНИЕ ==========
        function loadChats() {
            const saved = localStorage.getItem('muzaffar_chats_black');
            if (saved) {
                chats = JSON.parse(saved);
            }
            if (chats.length === 0) {
                createNewChat();
            } else {
                currentChatId = chats[0].id;
                renderChatList();
                loadChat(currentChatId);
            }
        }
        
        function saveChats() {
            localStorage.setItem('muzaffar_chats_black', JSON.stringify(chats));
        }
        
        // ========== УПРАВЛЕНИЕ ЧАТАМИ ==========
        function createNewChat() {
            const newChat = {
                id: Date.now(),
                title: `Новый чат ${chats.length + 1}`,
                date: new Date().toLocaleString(),
                messages: [
                    { id: Date.now(), role: 'ai', content: 'Привет! Я **MUZAFFAR AI Pro**.\n\nВот что я умею:\n\n• 📝 **Анализ изображений** - загрузи фото и спроси что на нём\n• 💻 **Подсветка кода** - вставляй код, я его подсвечу\n• 🎤 **Голосовой ввод** - говори, я распознаю\n• 📤 **Экспорт чатов** - сохраняй диалоги\n\nПопробуй отправить код или загрузить изображение! 🚀', timestamp: new Date().toLocaleTimeString() }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            renderChatList();
            loadChat(currentChatId);
            showToast('✨ Новый чат создан');
        }
        
        function deleteChat(chatId, event) {
            if (event) event.stopPropagation();
            if (chats.length === 1) {
                showToast('❌ Нельзя удалить последний чат');
                return;
            }
            chats = chats.filter(c => c.id !== chatId);
            if (currentChatId === chatId) {
                currentChatId = chats[0].id;
                loadChat(currentChatId);
            }
            saveChats();
            renderChatList();
            showToast('🗑️ Чат удален');
        }
        
        function clearAllChats() {
            if (confirm('⚠️ Вы уверены, что хотите удалить ВСЕ чаты? Это действие нельзя отменить.')) {
                chats = [];
                createNewChat();
                showToast('✅ Все чаты удалены');
            }
        }
        
        function loadChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            currentChatId = chatId;
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            chat.messages.forEach(msg => {
                renderMessage(msg);
            });
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id == chatId) item.classList.add('active');
            });
        }
        
        // ========== ОТОБРАЖЕНИЕ СООБЩЕНИЙ С ПОДСВЕТКОЙ КОДА ==========
        function renderMessage(msg) {
            const container = document.getElementById('messagesContainer');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${msg.role}`;
            
            let imagesHtml = '';
            if (msg.images && msg.images.length > 0) {
                imagesHtml = `<div class="message-images">`;
                msg.images.forEach(img => {
                    imagesHtml += `<img src="${img}" class="message-image" onclick="window.open('${img}', '_blank')">`;
                });
                imagesHtml += `</div>`;
            }
            
            // Обработка HTML и подсветка кода
            let contentHtml = '';
            if (msg.content) {
                // Подсветка блоков кода
                let processedContent = escapeHtml(msg.content);
                processedContent = processedContent.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                    return `<pre><code class="language-${lang || 'javascript'}">${escapeHtml(code)}</code></pre>`;
                });
                // Подсветка инлайн-кода
                processedContent = processedContent.replace(/`([^`]+)`/g, '<code>$1</code>');
                // Обработка жирного текста
                processedContent = processedContent.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                processedContent = processedContent.replace(/\n/g, '<br>');
                contentHtml = `<div class="message-content">${processedContent}</div>`;
            }
            
            wrapper.innerHTML = `
                <div class="message-bubble">
                    ${imagesHtml}
                    ${contentHtml}
                    <div class="message-time">${msg.timestamp}</div>
                </div>
                <div class="message-actions">
                    ${msg.role === 'user' ? `<button class="edit-msg-btn" onclick="editMessage(${msg.id})">✏️</button>` : ''}
                    <button class="copy-msg-btn" onclick="copyMessage('${escapeHtml(msg.content || '').replace(/'/g, "\\'")}')">📋</button>
                    <button class="copy-code-btn" onclick="extractAndCopyCode(${msg.id})">💻</button>
                </div>
            `;
            container.appendChild(wrapper);
            
            // Подсветка кода
            wrapper.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
            
            container.scrollTop = container.scrollHeight;
        }
        
        function extractAndCopyCode(msgId) {
            const chat = chats.find(c => c.id === currentChatId);
            const msg = chat.messages.find(m => m.id === msgId);
            if (msg && msg.content) {
                const codeBlocks = msg.content.match(/```(\w*)\n([\s\S]*?)```/g);
                if (codeBlocks) {
                    let allCode = '';
                    codeBlocks.forEach(block => {
                        const code = block.replace(/```\w*\n/, '').replace(/```$/, '');
                        allCode += code + '\n\n';
                    });
                    if (allCode) {
                        navigator.clipboard.writeText(allCode);
                        showToast('📋 Код скопирован');
                    } else {
                        showToast('❌ Нет кода в сообщении');
                    }
                } else {
                    showToast('❌ Нет кода в сообщении');
                }
            }
        }
        
        function editMessage(msgId) {
            const chat = chats.find(c => c.id === currentChatId);
            const msg = chat.messages.find(m => m.id === msgId);
            if (!msg || msg.role !== 'user') return;
            
            const newContent = prompt('Редактировать сообщение:', msg.content);
            if (newContent && newContent.trim()) {
                msg.content = newContent;
                saveChats();
                loadChat(currentChatId);
                sendMessageWithText(newContent);
            }
        }
        
        function copyMessage(text) {
            navigator.clipboard.writeText(text);
            showToast('📋 Сообщение скопировано');
        }
        
        function addMessageToCurrentChat(content, role, images = null) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                const newMsg = {
                    id: Date.now(),
                    role: role,
                    content: content,
                    images: images,
                    timestamp: new Date().toLocaleTimeString()
                };
                chat.messages.push(newMsg);
                if (chat.messages.length === 2 && role === 'user' && content) {
                    chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
                }
                saveChats();
                renderChatList();
                renderMessage(newMsg);
            }
        }
        
        // ========== ОТПРАВКА СООБЩЕНИЙ ==========
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            
            if (!text && currentImages.length === 0) return;
            if (isSending) return;
            
            if (currentImages.length > 0) {
                await sendMessageWithImages(text);
            } else if (text) {
                await sendMessageWithText(text);
            }
        }
        
        async function sendMessageWithText(text) {
            if (isSending) return;
            isSending = true;
            
            addMessageToCurrentChat(text, 'user', null);
            
            const container = document.getElementById('messagesContainer');
            const typingDiv = createTypingIndicator(container);
            
            try {
                const chat = chats.find(c => c.id === currentChatId);
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: TEXT_MODEL,
                        messages: [
                            { role: "system", content: "Ты MUZAFFAR AI Pro - дружелюбный, умный ассистент. Отвечай развернуто на русском языке. Если видишь код - объясняй его. Будь полезным." },
                            ...chat.messages.filter(m => m.role !== 'ai').map(m => ({
                                role: m.role === 'user' ? 'user' : 'assistant',
                                content: m.content
                            }))
                        ],
                        temperature: 0.8,
                        max_tokens: 1500
                    })
                });
                
                typingDiv.remove();
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMessageToCurrentChat(reply, 'ai', null);
                
            } catch (error) {
                typingDiv.remove();
                console.error('Error:', error);
                addMessageToCurrentChat(`❌ Ошибка: ${error.message}`, 'ai', null);
            } finally {
                isSending = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('userInput').focus();
            }
        }
        
        async function sendMessageWithImages(text) {
            if (isSending) return;
            isSending = true;
            
            const userText = text || "Опиши это изображение подробно";
            const imagesToSend = [...currentImages];
            
            const chat = chats.find(c => c.id === currentChatId);
            chat.messages.push({
                id: Date.now(),
                role: 'user',
                content: userText,
                images: imagesToSend,
                timestamp: new Date().toLocaleTimeString()
            });
            saveChats();
            renderMessage(chat.messages[chat.messages.length - 1]);
            
            document.getElementById('filePreview').innerHTML = '';
            document.getElementById('filePreview').style.display = 'none';
            document.getElementById('userInput').value = '';
            currentImages = [];
            
            const container = document.getElementById('messagesContainer');
            const typingDiv = createTypingIndicator(container);
            
            try {
                const contentArray = [];
                for (const img of imagesToSend) {
                    contentArray.push({
                        type: "image_url",
                        image_url: { url: img }
                    });
                }
                contentArray.push({
                    type: "text",
                    text: userText + " Опиши подробно на русском языке."
                });
                
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: VISION_MODEL,
                        messages: [
                            {
                                role: "system",
                                content: "Ты MUZAFFAR AI Pro - ассистент с анализом изображений. Описывай изображения подробно, отвечай на русском языке."
                            },
                            {
                                role: "user",
                                content: contentArray
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });
                
                typingDiv.remove();
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMessageToCurrentChat(reply, 'ai', null);
                
            } catch (error) {
                typingDiv.remove();
                addMessageToCurrentChat(`❌ Ошибка анализа: ${error.message}`, 'ai', null);
            } finally {
                isSending = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('userInput').focus();
            }
        }
        
        // ========== КОД В ЧАТЕ ==========
        function openCodeModal() {
            document.getElementById('codeModal').style.display = 'flex';
            document.getElementById('codeInput').value = '';
        }
        
        function closeCodeModal() {
            document.getElementById('codeModal').style.display = 'none';
        }
        
        function insertCode() {
            const code = document.getElementById('codeInput').value.trim();
            const language = document.getElementById('codeLanguage').value;
            
            if (!code) {
                showToast('⚠️ Введите код');
                return;
            }
            
            const formattedCode = `\`\`\`${language}\n${code}\n\`\`\``;
            const input = document.getElementById('userInput');
            const currentText = input.value;
            
            if (currentText) {
                input.value = currentText + '\n\n' + formattedCode;
            } else {
                input.value = formattedCode;
            }
            
            closeCodeModal();
            showToast('💻 Код добавлен в сообщение');
            document.getElementById('userInput').focus();
        }
        
        function createTypingIndicator(container) {
            const div = document.createElement('div');
            div.className = 'message-wrapper ai';
            div.id = 'typing-indicator';
            div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span> Печатает...</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }
        
        // ========== ГОЛОСОВОЙ ВВОД ==========
        let recognition = null;
        let isRecording = false;
        
        function toggleVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showToast('❌ Голосовой ввод не поддерживается');
                return;
            }
            
            if (isRecording) {
                stopVoiceInput();
                return;
            }
            
            const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('voiceBtn').classList.add('recording');
                showToast('🎤 Говорите...');
            };
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                showToast(`📝 Распознано: ${text.substring(0, 50)}`);
                stopVoiceInput();
            };
            
            recognition.onerror = () => {
                showToast('❌ Ошибка распознавания');
                stopVoiceInput();
            };
            
            recognition.onend = () => stopVoiceInput();
            recognition.start();
        }
        
        function stopVoiceInput() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            isRecording = false;
            const voiceBtn = document.getElementById('voiceBtn');
            if (voiceBtn) voiceBtn.classList.remove('recording');
        }
        
        // ========== ЗАГРУЗКА ИЗОБРАЖЕНИЙ ==========
        function handleFiles(files) {
            const preview = document.getElementById('filePreview');
            preview.innerHTML = '';
            preview.style.display = 'flex';
            currentImages = [];
            
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        currentImages.push(e.target.result);
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.title = file.name;
                        preview.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                } else {
                    showToast('⚠️ Поддерживаются только изображения');
                }
            });
        }
        
        // ========== ЭКСПОРТ ==========
        function exportChatAsText() {
            const chat = chats.find(c => c.id === currentChatId);
            let text = `MUZAFFAR AI Pro - Экспорт чата\nДата: ${chat.date}\n\n`;
            chat.messages.forEach(msg => {
                const role = msg.role === 'user' ? 'Пользователь' : 'MUZAFFAR AI';
                text += `[${role}] ${msg.timestamp}:\n${msg.content}\n\n---\n\n`;
            });
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `muzaffar_chat_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📄 Чат экспортирован');
        }
        
        function shareChatAsJSON() {
            const chat = chats.find(c => c.id === currentChatId);
            const json = JSON.stringify(chat, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `muzaffar_chat_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 JSON сохранен');
        }
        
        function copyChatLink() {
            navigator.clipboard.writeText(window.location.href);
            showToast('🔗 Ссылка скопирована');
        }
        
        function renderChatList() {
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            chats.forEach(chat => {
                const chatDiv = document.createElement('div');
                chatDiv.className = `chat-item ${currentChatId === chat.id ? 'active' : ''}`;
                chatDiv.dataset.id = chat.id;
                chatDiv.onclick = () => loadChat(chat.id);
                chatDiv.innerHTML = `
                    <div class="chat-item-title">${escapeHtml(chat.title)}</div>
                    <div class="chat-item-date">${chat.date}</div>
                    <button class="delete-chat-btn" onclick="deleteChat(${chat.id}, event)">🗑️</button>
                `;
                container.appendChild(chatDiv);
            });
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Закрытие модалки по клику вне
        window.onclick = (event) => {
            const modal = document.getElementById('codeModal');
            if (event.target === modal) closeCodeModal();
        };
        
        // Инициализация
        loadChats();
        
        // Защита изображений
        document.addEventListener('contextmenu', (e) => {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
                showToast('🔒 Сохранение изображений отключено');
                return false;
            }
        });
        
        console.log('%c⚡ MUZAFFAR AI Pro | Чёрная тема | Подсветка кода', 'color: #00ff88; font-size: 14px; font-weight: bold;');
    </script>
</body>
